apis:
- aid: worldcat:worldcat-knowledge-base-api
  name: WorldCat Knowledge Base API
  description: >-
    Provides developer-level access to a library's information in the WorldCat Knowledge Base, combining
    data about a library's e-content with access through linking features. Supports OpenURL requests for
    matching citations and retrieving access links, and REST requests for browsing and searching library
    subscription resources.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.oclc.org/developer/api/oclc-apis/worldcat-knowledge-base-api.en.html
