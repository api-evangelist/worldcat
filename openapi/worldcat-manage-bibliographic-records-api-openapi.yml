      summary: Bibliographic record has bad data
      value:
        errorCount: 1,
        errors: -"Invalid symbol OCWMS in 1st $c in 040."
        variableFieldErrors:
          -tag: '040'
          errorLevel: CRITICAL
          message: Invalid symbol OCWMS in 1st $c in 040.
    bib-marcxml-existing:
      summary: Bibliographic MARC XML record
      value: "<record>\n  <leader>00000nam a2200000 a 4500</leader>\n  <controlfield tag=\"001\">ocn970988303</controlfield>\n  <controlfield tag=\"008\">120827s2012    nyua          000 0 eng d</controlfield>\n  <datafield tag=\"010\" ind1=\" \" ind2=\" \">\n    <subfield code=\"a\">   63011276 </subfield>\n  </datafield>\n  <datafield tag=\"040\" ind1=\" \" ind2=\" \">\n    <subfield code=\"a\">OCWMS</subfield>\n    <subfield code=\"b\">eng</subfield>\n    <subfield code=\"c\">OCWMS</subfield>\n  </datafield>\n  <datafield tag=\"100\" ind1=\"0\" ind2=\" \">\n    <subfield code=\"a\">OCLC Developer Network</subfield>\n  </datafield>\n  <datafield tag=\"245\" ind1=\"1\" ind2=\"0\">\n    <subfield code=\"a\">Test Record</subfield>\n  </datafield>\n  <datafield tag=\"500\" ind1=\" \" ind2=\" \">\n    <subfield code=\"a\">FOR OCLC DEVELOPER NETWORK DOCUMENTATION</subfield>\n  </datafield>\n</record>\n"
    validate-multiple-errors:
      summary: Multiple Errors
      value:
        status:
          summary: INVALID
          description: The provided Bib is invalid
          validationErrors:
            errorCount: 4
            errors: -"The record has been updated by another user." -"Not authorized to delete $d in 040." -"Not authorized to change Record Status (Leader/05) to n." -"Invalid relationship - when 245 is present, then $a in 245 or $k in 245 must be present."
            recordLevelErrors:
            - message: The record has been updated by another user.
              errorLevel: MINOR
              tag: REC
              occurrence: 1
            - message: Not authorized to delete $d in 040.
              errorLevel: CRITICAL
              tag: REC
              occurrence: 1
            fixedFieldErrors:
            - tag: '000'
              errorLevel: MINOR
              message: Not authorized to change Record Status (Leader/05) to n.
            variableFieldErrors:
            - tag: '245'
              errorLevel: CRITICAL
              message: Invalid relationship - when 245 is present, then $a in 245 or $k in 245 must be present.
    failed-not-found:
      summary: Error when resource not found
      value:
        type: NOT_FOUND
        title: Resource Not Found
        detail: The specified resource was not found at this address.
  parameters:
    oclcNumberListReq:
      name: oclcNumbers
      in: query
      description: One or more OCLC numbers. Separated by comma if providing multiple.
      required: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OclcNumber'
      example: 41266045,1056157740
    oclcNumberAsId:
      name: oclcNumber
      in: path
      description: The OCLC number of the Bibliographic record
      required: true
      schema:
        $ref: '#/components/schemas/schemas-OclcNumber'
      example: 41266045
  responses:
    500-internal-server-error:
      description: Something went wrong (hopefully rare) - please try again.
      content:
        application/json:
          examples:
            accept-header-unacceptable:
              summary: Unexpected Error.
              value:
                type: INTERNAL_SERVER_ERROR
                title: string
                detail: string
    unauthorized:
      description: Unauthorized
      content:
        application/json:
          examples:
            unauthorized:
              $ref: '#/components/examples/unauthorized'
    failed-not-found:
      description: Failed operation - resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            failed-not-found:
              $ref: '#/components/examples/failed-not-found'
    406-accept-header-unacceptable:
      description: Accept Header Media Type is not Supported.
      content:
        application/json:
          examples:
            accept-header-unacceptable:
              summary: Accept Header Unacceptable
              value:
                type: NOT_ACCEPTABLE
                title: Invalid 'Accept' header.
                detail: 'A request with an invalid ''Accept'' header was attempted: ....'
    403-forbidden-url:
      description: Forbidden URL.
      content:
        application/json:
          examples:
            forbidden-url:
              summary: Forbidden URL
              value:
                message: '''tk_TW6fPd4fgsaA45HIYslXmeSlc1DleGlOdBCdVimq'' not a valid key=value pair (missing equal-sign) in Authorization header: ''Bearer tk_TW6fPd4fgsaA45HIYslXmeSlc1DleGlOdBCdVimq''.'
  securitySchemes:
    entity_data_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://oauth.oclc.org/token
          scopes:
            publicEntities:read_brief_entities: read brief entity data
            publicEntities:read_references: read entity references
        authorizationCode:
          authorizationUrl: https://oauth.oclc.org/auth
          tokenUrl: https://oauth.oclc.org/token
          scopes:
            publicEntities:read_brief_entities: read brief entity data
            publicEntities:read_references: read entity references
