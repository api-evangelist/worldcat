  parameters:
    accept:
      name: Accept
      in: header
      description: Content Type the client supports and is requesting (application/json currently supported)
      schema:
        type: string
        default: application/json
      required: false
    parameters-oclcNumberAsId:
      name: oclcNumber
      in: path
      description: record OCLC number
      required: true
      schema:
        $ref: '#/components/schemas/OclcNumber'
      example: 41266045
    creator:
      name: creator
      in: query
      description: creator strings to filter to
      required: false
      schema:
        description: pipe delimited set of creator strings to filter to
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
        example:
        - austen
        - jane|bronte
        - emily
      explode: false
      style: pipeDelimited
    heldByGroup:
      name: heldByGroup
      in: query
      description: Restrict to holdings held by Group Symbol
      required: false
      schema:
        type: string
      example: ASRL
    spProgram:
      name: spProgram
      in: query
      description: Limiter to restrict the response to bibliographic records associated with a particular shared print program (l8 index).
      required: false
      schema:
        type: string
      example: WEST
    heldBySymbol:
      name: heldBySymbol
      in: query
      description: Institution Symbol
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OCLCSymbol'
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - TXH
        multiple:
          value:
          - TXH
          - YSM
    facets:
      name: facets
      in: query
      description: The requested list of facets requested in the response
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - subject
          - creator
          - datePublished
          - genre
          - itemType
          - itemSubTypeBrief
          - itemSubType
          - language
          - topic
          - subtopic
          - content
          - audience
          - databases
        minItems: 1
        maxItems: 13
      explode: false
      examples:
        single:
          value:
          - creator
        multiple:
          value:
          - creator
          - itemType
    query:
      name: q
      in: query
      description: query in the form of a keyword search or fielded search, for example  (au:gazihan OR au:womacka) AND kw:java See - https://help.oclc.org/Librarian_Toolbox/Searching_WorldCat_Indexes/Bibliographic_records/Bibliographic_record_indexes/Bibliographic_record_index_lists
      required: true
      schema:
        type: string
      example: 'ti: Simon''s Cat'
    limit:
      name: limit
      in: query
      description: maximum number of records to return, maximum 50, default 10
      required: false
      schema:
        type: integer
        format: int32
        default: 10
      example: 50
    dbIds:
      name: dbIds
      in: query
      description: The database IDs to filter to
      required: false
      schema:
        type: array
        items:
          type: integer
        minItems: 1
      explode: false
    heldByInstitutionID:
      name: heldByInstitutionID
      in: query
      description: Institution registryId
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RegistryId'
        minItems: 0
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - 128807
        multiple:
          value:
          - 128807
          - 91475
    heldBy:
      name: heldBy
      in: query
      description: Institution Symbol
      deprecated: true
      required: false
      schema:
        type: string
      example: TXH
    preferredLanguage:
      name: preferredLanguage
      in: query
      description: language user would prefer metadata description in
      required: false
      schema:
        description: three character MARC code for language to prefer records in
        type: string
        example: fre
    unit:
      name: unit
      in: query
      description: distance unit
      required: false
      schema:
        $ref: '#/components/schemas/Unit'
    topic:
      name: topic
      in: query
      description: topic to limit results to (s0 index). Based on OCLC Conspectus Division
      required: false
      schema:
        type: string
      example: 34000000
    lon:
      name: lon
      in: query
      description: longitude
      required: false
      schema:
        $ref: '#/components/schemas/Longitude'
    audience:
      name: audience
      in: query
      description: Audience to limit results to
      required: false
      schema:
        type: string
        enum:
        - juv
        - nonJuv
      example: juv
    groupRelatedEditions:
      name: groupRelatedEditions
      in: query
      description: Whether or not to use FRBR grouping. Default is 'false'
      required: false
      schema:
        type: boolean
        default: false
    enableSearchExpansion:
      name: enableSearchExpansion
      in: query
      description: whether or not to expand search terms
      schema:
        type: boolean
        default: false
    genre:
      name: genre
      in: query
      description: Genre to limit results to (ge index)
      required: false
      schema:
        type: string
      example: fiction
    showHoldingIndicators:
      name: showHoldingsIndicators
      in: query
      description: whether or not to show holdings indicators in response
      required: false
      schema:
        type: boolean
        default: false
    showLocalBibData:
      name: showLocalBibData
      in: query
      description: whether or not to show local bibliographic data in response
      required: false
      schema:
        type: boolean
        default: false
    materialType:
      name: materialType
      in: query
      description: Limiter to restrict the response to the specified material type (mt index). (URL, LPS)
      required: false
      schema:
        type: string
      example: URL
    subtopic:
      name: subtopic
      in: query
      description: subtopic to limit results to (s1 index). Based on OCLC Conspectus Category
      required: false
      schema:
        type: string
      example: 34932000
    offset:
      name: offset
      in: query
      description: start position of the bib records to return (0 based), default 0
      required: false
      schema:
        type: integer
        format: int32
        default: 0
      example: 10
    catalogSource:
      name: catalogSource
      in: query
      description: Limiter to restrict the response to the single OCLC symbol as the cataloging source (cs index). (OSL)
      required: false
      schema:
        type: string
      example: OCL
    editionOrderBy:
      name: orderBy
      in: query
      description: how to sort the edition resultsresults
      schema:
        type: string
        enum:
        - library
        - recency
        - bestMatch
        - creator
        - publicationDateAsc
        - publicationDateDesc
        - language
        - mostWidelyHeld
        - title
        default: publicationDateDesc
      example: language
    retentionCommitments:
      name: retentionCommitments
      in: query
      description: Limiter to restrict the response to bibliographic records with a retention commitment (l8 index).
      required: false
      schema:
        type: boolean
        default: false
    lat:
      name: lat
      in: query
      description: latitude
      required: false
      schema:
        $ref: '#/components/schemas/Latitude'
    orderBy:
      name: orderBy
      in: query
      description: result sort key
      required: false
      schema:
        type: string
        default: bestMatch
        enum:
        - library
        - recency
        - bestMatch
        - creator
        - publicationDateAsc
        - publicationDateDesc
        - mostWidelyHeld
        - title
    inLanguage:
      name: inLanguage
      in: query
      description: Limiter to restrict the response to the single specified language (ln index). (eng, fre, ger)
      required: false
      schema:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - eng
        multiple:
          value:
          - eng
          - fre
          - ger
    inCatalogLanguage:
      name: inCatalogLanguage
      in: query
      description: Limiter to restrict the response to the single specified cataloging language (ll index). (dut, eng)
      required: false
      schema:
        type: string
      example: eng
    bookReviews:
      name: bookReviews
      in: query
      description: Filter results to include, exclude, or only show book reviews
      required: false
      schema:
        type: string
        enum:
        - include
        - exclude
        - only
        default: exclude
      example: exclude
    groupVariantRecords:
      name: groupVariantRecords
      in: query
      description: Whether or not to group variant records. Default is 'false'
      required: false
      schema:
        type: boolean
        default: false
    newsArticles:
      name: newsArticles
      in: query
      description: Filter results to include, exclude, or only show news articles
      required: false
      schema:
        type: string
        enum:
        - include
        - exclude
        - only
        default: exclude
      example: exclude
    itemSubType:
      name: itemSubType
      in: query
      description: Limiter to restrict the response to the single specified OCLC sub facet type (x1 index). (dvd, digital)
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ItemSubType'
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - book-digital
        multiple:
          value:
          - book-digital
          - audiobook-digital
    distance:
      name: distance
      in: query
      description: distance
      required: false
      schema:
        type: integer
        format: int32
      example: 10
    peerReviewed:
      name: peerReviewed
      in: query
      description: filter to just peer reviewed content
      required: false
      schema:
        type: boolean
    heldByBranchID:
      name: heldByBranchID
      in: query
      description: Filter holdings to specified branch IDs
      required: false
      schema:
        type: array
        items:
          type: integer
        minItems: 1
        maxItems: 5
      explode: false
    heldByRelevanceGroup:
      name: heldByRelevanceGroup
      in: query
      description: Filter holdings to specified relevance groups
      required: false
      schema:
        type: array
        items:
          type: integer
        minItems: 1
        maxItems: 5
      explode: false
    oclcNumberAsId:
      name: oclcNumber
      in: path
      description: record OCLC number
      required: true
      schema:
        $ref: '#/components/schemas/OclcNumber'
      example: 41266045
    content:
      name: content
      in: query
      description: Content to limit results to
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - fic
          - nonFic
          - bio
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - fic
        multiple:
          value:
          - fic
          - bio
    itemType:
      name: itemType
      in: query
      description: Limiter to restrict the response to the single specified OCLC top-level facet type (x0 index). (book, image)
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ItemType'
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - book
        multiple:
          value:
          - book
          - audiobook
    openAccess:
      name: openAccess
      in: query
      description: filter to just open access content
      required: false
      schema:
        type: boolean
    deweyNumber:
      name: deweyNumber
      in: query
      description: Limiter to restrict the response to the specified dewey classification number(s). For multiple values repeat the URL parameter. (dd index)
      required: false
      schema:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single:
          value:
          - 870
    datePublished:
      name: datePublished
      in: query
      description: Limiter to restrict the response to one or more dates or to a range (in index). (2000, 2000-2010, 1990,1991)
      required: false
      schema:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
      explode: false
      examples:
        single_date:
          value:
          - 2000
        multiple_dates:
          value:
          - 1990
          - 1991
        range:
          value:
          - 2000-2010
