          - href: http://worldcat.org/webservices/kb/export/128807/128807_NPG.openAccess_kbart.txt
            rel: enclosure
            title: kbart file
            length: 53000
          provider_uid: NPG
          provider_name: Nature Publishing Group
          collection_uid: NPG.openAccess
          owner_institution: '128807'
          source_institution: '6569'
