          rel: self
        - href: http://worldcat.org/webservices/kb/rest/collections/NPG.journals.html
          rel: alternate
        - href: http://www.nature.com
          rel: via
        - href: http://worldcat.org/webservices/kb/export/6569/6569_NPG.journals_kbart.txt
          rel: enclosure
