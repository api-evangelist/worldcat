          title_link_template: '[[localstem]][[url]]'
          linkscheme: npg
          uhf_version: release1574104235-NPG
          wcsync_enabled: 'false'
          marcdelivery_enabled: 'false'
          marcdelivery_no_delete: 'false'
          open: 'false'
          available_entries: '106'
          selected_entries: '106'
          localstem: 'true'
  schemas:
    CollectionSearchResults:
      type: object
      properties:
        title:
          description: name of the results
          type: string
        updated:
          description: date query run
          type: string
        id:
          description: ID for result set
          type: string
        author:
          description: who created the result set
          type: string
        links:
          description: Link to the results
          type: string
        totalResults:
          description: Total number of results
          type: integer
          format: int32
        startIndex:
          description: start position of the results
          type: integer
          format: int32
        itemsPerPage:
          description: number of items per page
          type: integer
          format: int32
        Query:
          description: query sent to API
          type: string
        entries:
          description: actual results
          type: array
          items:
            $ref: '#/components/schemas/Collection'
    Collection:
      type: object
      required:
      - title
      - id
      - links
      - provider_uid
      - provider_name
      - collection_uid
      - available_entries
      - selected_entries
      - open
      properties:
        title:
          description: Name of Collection
          type: string
        id:
          description: URL for Collection in API
          type: string
        links:
          description: links associated with Collection
          type: array
          items:
            $ref: '#/components/schemas/Link'
        provider_uid:
          description: Id for provider who supplies the collection
          type: string
        provider_name:
          description: name for provider who supplies the collection
          type: string
        collection_uid:
          description: Id for collection
          type: string
        owner_institution:
          description: Institution who has holdings set fo the collection
          type: string
        source_institution:
          description: The institution who originally added the collection to the knowledge base. 6569 represents OCLC
          type: string
        collection_status:
          description: Status of the collection
          type: string
          enum:
          - raw
          - copy
          - select
          - empty
        collection_type:
          description: Kind of collection
          type: string
          enum:
          - openaccess
          - browseable
        title_link_template:
          description: pattern for creating link to title
          type: string
        uhf_version:
          description: something
          type: string
        marcdelivery_no_delete:
          description: Whether or not to deliver MARC records for collection
          type: boolean
        open:
          description: If the collection is open access
          type: boolean
        available_entries:
          description: Number of available entries in a collection
          type: integer
          format: int32
        selected_entries:
          description: Number of selected entries in a collection
          type: integer
          format: int32
        localstem:
          description: something
          type: boolean
    Link:
      type: object
      properties:
        href:
          type: string
        rel:
          type: string
          enum:
          - self
          - alternate
          - parent
          - enclosure
          - via
  securitySchemes:
    api_key:
      type: apiKey
      name: wskey
      in: query
externalDocs:
  description: Find out more about WorldCat Knowledge Base API
  url: https://www.oclc.org/developer/api/oclc-apis/worldcat-knowledge-base-api.en.html
